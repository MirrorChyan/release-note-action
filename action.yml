name: MirrorChyan Release Note
description: MirrorChyan Release Note
author: MirrorChyan

branding:
  icon: arrow-up
  color: black

inputs:
  version_name:
    required: false
  release_note:
    required: false

  mirrorchyan_rid:
    required: true
  upload_token:
    required: true
  github_token:
    required: false

  # for test
  fake_upload:
    required: false
    default: "false"

outputs:
  error:
    value: ${{ steps.upload.outputs.error }}
  msg:
    value: ${{ steps.upload.outputs.msg }}
  response:
    value: ${{ steps.upload.outputs.response }}

runs:
  using: "composite"
  steps:
    - id: latest-release
      uses: pozetroninc/github-action-get-latest-release@master
      with:
        owner: ${{ github.repository_owner }}
        repo: ${{ github.event.repository.name }}
        token: ${{ inputs.github_token }}

    - name: Organize information
      id: information
      shell: bash
      run: |
        version_name=${{ inputs.version_name == "" && steps.latest-release.outputs.release || inputs.version_name }}
        release_note=${{ inputs.version_name == "" && steps.latest-release.outputs.description || inputs.release_note }}
      
        echo "version_name=$version_name" | tee -a "$GITHUB_OUTPUT"
        echo "release_note=$release_note" | tee -a "$GITHUB_OUTPUT"

    - name: Upload to MirrorChyan
      id: upload
      shell: bash
      run: |
        if [[ ${{ inputs.fake_upload }} != true ]]; then
          response=$(curl --location --request POST 'https://mirrorc.top/api/resources/${{ inputs.mirrorchyan_rid }}/versions/release-note' \
            --header 'Authorization:${{ inputs.upload_token }}' \
            --form 'version_name="${{ steps.information.outputs.version_name }}"' \
            --form 'content=@"${{ steps.information.outputs.release_note }}"')
        else
          curl --output /dev/null --location --request POST 'www.github.com' \
            --header 'Authorization:${{ inputs.upload_token }}' \
            --form 'version_name="${{ steps.information.outputs.version_name }}"' \
            --form 'content=@"${{ steps.information.outputs.release_note }}"')
          response='{"code":0,"msg":"success","data":{"id":114514,"name":"${{ steps.information.outputs.version_name }}","number":1919810}}'
        fi

        error=$(echo "$response" | jq .code)
        msg=$(echo "$response" | jq .msg)
        
        echo "response=$response" | tee -a "$GITHUB_OUTPUT"
        echo "error=$error" | tee -a "$GITHUB_OUTPUT"
        echo "msg=$msg" | tee -a "$GITHUB_OUTPUT"

        if [[ $error != 0 ]]; then
          echo "Bad Response!"
          exit 1
        fi
